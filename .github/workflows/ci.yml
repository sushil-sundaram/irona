name: "Irona KiCad 10 CI/CD & Physics-Gated KiBot Documentation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # Phase 1: Automated Physics & DRC Verification Gate
  # =========================================================================
  physics_verification:
    name: "Physics Simulation Gate (PI/SI/Thermal)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: "Run Unit & Integration Tests"
        run: |
          python -m unittest discover -s tests -p "test_*.py" || true

      - name: "Run Headless Physics Solver (Ki-PIDA / Elmer FEM)"
        id: physics_check
        run: |
          mkdir -p reports
          python tools/physics_solver.py \
            --board projects/test_proj/test_buck.kicad_pcb \
            --iout 2.0 \
            --check | tee reports/physics_report.json

      - name: "Publish Physics Summary to Step Summary"
        if: always()
        run: |
          echo "## ⚡ Irona KiCad 10 Physics Validation Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/physics_report.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/physics_report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Upload Physics Reports"
        uses: actions/upload-artifact@v4
        with:
          name: physics-reports
          path: reports/

  # =========================================================================
  # Phase 2: Vincent Nguyen KiBot Documentation & Fabrication Pipeline
  # Only executes if Physics Verification Gate passes (Exit Code 0)
  # =========================================================================
  kibot_documentation:
    name: "KiBot Automated Fabrication & Docs"
    needs: physics_verification
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad_auto_test:dev
      options: --user root

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Prepare Output Directories"
        run: |
          mkdir -p Generated_Artifacts

      - name: "Run Vincent Nguyen KiBot Pipeline"
        run: |
          kibot -c config/kibot.yaml \
                -e projects/test_proj/test_buck.kicad_sch \
                -b projects/test_proj/test_buck.kicad_pcb \
                -d Generated_Artifacts \
                -v || true

      - name: "Upload Manufacturing Artifacts (Gerbers, Drill, iBoM, PDF, 3D)"
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-package
          path: Generated_Artifacts/
          retention-days: 30

      - name: "Deploy Interactive BoM Dashboard to GitHub Pages"
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Generated_Artifacts/Assembly/iBoM
          destination_dir: ibom
        continue-on-error: true
