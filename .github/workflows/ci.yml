name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests + simulation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Simulation gate (sample project)
        run: |
          mkdir -p reports
          python -m irona sim projects/buck_12v_3v3 --check | tee reports/simulation.json
      - name: Rule checks (sample project)
        run: python -m irona check projects/buck_12v_3v3 --check | tee reports/checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/

  docs:
    name: Fabrication outputs
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad_auto_test:dev
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Irona docs (report, schematic PDF, Gerbers, BOM, fab zip)
        run: python3 -m irona docs projects/buck_12v_3v3 --out docs-out
      - name: KiBot outputs (iBoM, renders, STEP)
        run: kibot -c config/kibot.yaml -e projects/buck_12v_3v3/buck_12v_3v3.kicad_sch -b projects/buck_12v_3v3/buck_12v_3v3.kicad_pcb -d docs-out/kibot
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs-out/
