[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irona-kicad"
version = "2.0.0"
description = "KiCad plugins and CLI: board simulation, DRC/ERC, design review and documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only; kicad-cli is used for Gerbers/drill/schematic PDF when present

[project.scripts]
irona = "irona.cli:main"

[tool.setuptools.packages.find]
include = ["irona*"]

[tool.setuptools.package-data]
irona = ["happy/*.md", "happy/**/*.md"]
