[package]
name = "kicad_elmer_engine"
version = "0.1.0"
edition = "2021"

[lib]
# "cdylib" tells Rust to compile a dynamic library (.so on Linux/Mac, .pyd on Windows)
name = "kicad_elmer_engine"
crate-type = ["cdylib"]

[dependencies]
# We use abi3-py39 so the compiled module is compatible with any Python >= 3.9
# (KiCad 7 and 8 use Python 3.9 or higher)
pyo3 = { version = "0.20.0", features = ["abi3-py39", "extension-module"] }